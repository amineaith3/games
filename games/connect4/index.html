<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Connect 4 | Sirius Games</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'], } } } }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="../../assets/favicon.ico">
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen flex flex-col items-center justify-center font-sans selection:bg-red-500/30 relative overflow-hidden">
  <div class="absolute inset-0 pointer-events-none z-0 flex justify-center items-center">
    <div class="absolute w-[500px] h-[500px] bg-red-600/10 rounded-full blur-[120px]"></div>
  </div>
  <div class="bg-slate-900/60 border border-slate-800 p-8 rounded-3xl shadow-2xl backdrop-blur-md relative z-10 w-full max-w-xl text-center flex flex-col items-center">
    <h1 class="text-3xl font-extrabold mb-2 text-white tracking-tight">🔴 <span class="text-transparent bg-clip-text bg-gradient-to-r from-red-400 to-red-600">Connect 4</span> 🟡</h1>
    <p class="text-slate-400 mb-4 text-sm" id="status">Red's Turn</p>
    <div id="board" class="grid grid-cols-7 gap-2 bg-blue-900/40 p-3 rounded-xl border border-blue-800/50 mb-6"></div>
    <div class="flex flex-col sm:flex-row justify-center gap-3 w-full max-w-sm">
       <button id="restartBtn" class="flex-1 px-4 py-2 rounded-lg bg-red-600 hover:bg-red-700 text-white font-medium transition-colors shadow-lg shadow-red-500/20">
         🔄 Restart
       </button>
       <a href="../../index.html" class="flex-1 px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium transition-colors border border-slate-700 hover:border-slate-600">
         ← Back
       </a>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
