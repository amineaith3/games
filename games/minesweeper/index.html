<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Minesweeper | Sirius Games</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'], } } } }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="../../assets/favicon.ico">
  <style>
    .cell { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; user-select: none;}
    .cell.unrevealed { background-color: #334155; border: 2px solid #475569; border-top-color: #64748b; border-left-color: #64748b;}
    .cell.unrevealed:hover { background-color: #475569; }
    .cell.revealed { background-color: #1e293b; border: 1px solid #334155; }
  </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen flex flex-col items-center justify-center font-sans selection:bg-slate-500/30 relative overflow-hidden">
  <div class="absolute inset-0 pointer-events-none z-0 flex justify-center items-center">
    <div class="absolute w-[500px] h-[500px] bg-slate-600/10 rounded-full blur-[120px]"></div>
  </div>
  <div class="bg-slate-900/60 border border-slate-800 p-8 rounded-3xl shadow-2xl backdrop-blur-md relative z-10 w-full max-w-xl text-center flex flex-col items-center">
    <h1 class="text-3xl font-extrabold mb-2 text-white tracking-tight">💣 <span class="text-transparent bg-clip-text bg-gradient-to-r from-slate-300 to-slate-500">Minesweeper</span></h1>
    <div class="flex justify-between w-full max-w-[320px] mb-4 text-lg font-bold bg-slate-800 px-4 py-2 rounded-lg border border-slate-700">
        <span class="text-red-400">🚩 <span id="flagsLeft">10</span></span>
        <span id="status" class="text-slate-300 cursor-pointer" onclick="initGame()">🙂</span>
        <span class="text-blue-400">⏱ <span id="timer">0</span></span>
    </div>

    <div id="board" class="grid grid-cols-10 gap-0 border-4 border-slate-700 mb-6 bg-slate-700 mx-auto"></div>

    <div class="flex flex-col sm:flex-row justify-center gap-3 w-full max-w-[320px] mx-auto">
       <button id="restartBtn" class="flex-1 px-4 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-white font-medium transition-colors shadow-lg border border-slate-600">
         🔄 Restart
       </button>
       <a href="../../index.html" class="flex-1 px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium transition-colors border border-slate-700 hover:border-slate-600">
         ← Back
       </a>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
