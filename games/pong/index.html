<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pong | Sirius Games</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="icon" href="../../assets/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../../assets/favicon-16x16.png">
  <link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png">
</head>

<body class="bg-slate-950 text-slate-200 min-h-screen flex flex-col items-center justify-center font-sans selection:bg-cyan-500/30 relative overflow-hidden">
  
  <div class="absolute inset-0 pointer-events-none z-0 flex justify-center items-center">
    <div class="absolute w-[500px] h-[500px] bg-cyan-600/10 rounded-full blur-[120px]"></div>
  </div>

  <div class="bg-slate-900/60 border border-slate-800 p-8 rounded-3xl shadow-2xl backdrop-blur-md relative z-10 w-full max-w-[35rem] text-center flex flex-col items-center">
    
    <h1 class="text-3xl font-extrabold mb-2 text-white tracking-tight">🏓 <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-cyan-600">Pong</span></h1>
    <p class="text-slate-400 mb-6 text-sm">Use ↑ ↓ arrows to keep the ball in play!</p>

    <canvas id="pongCanvas" class="bg-slate-950 rounded-xl mb-4 border border-slate-700 w-full max-w-xl" width="500" height="600"></canvas>
    
    <p id="score" class="text-xl font-bold mb-4 text-white tracking-wider">Score: 0</p>

    <div class="flex flex-col sm:flex-row justify-center gap-3 w-full max-w-sm">
       <button id="reset" class="flex-1 px-4 py-2 rounded-lg bg-cyan-600 hover:bg-cyan-700 text-white font-medium transition-colors shadow-lg shadow-cyan-500/20">
         🔄 Restart
       </button>
       <a href="../../index.html" class="flex-1 px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium transition-colors border border-slate-700 hover:border-slate-600">
         ← Back to games
       </a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
