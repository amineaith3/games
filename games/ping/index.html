<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ping Game | Sirius Games</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="icon" href="../../assets/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../../assets/favicon-16x16.png">
  <link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png">
</head>

<body class="bg-slate-950 text-slate-200 min-h-screen flex flex-col items-center justify-center font-sans selection:bg-yellow-500/30 relative overflow-hidden">
  
  <!-- Background Glow Effects -->
  <div class="absolute inset-0 pointer-events-none z-0 flex justify-center items-center">
    <div class="absolute w-[500px] h-[500px] bg-yellow-600/10 rounded-full blur-[120px]"></div>
  </div>

  <div class="bg-slate-900/60 border border-slate-800 p-8 rounded-3xl shadow-2xl backdrop-blur-md relative z-10 w-full max-w-md text-center flex flex-col items-center">
    
    <h1 class="text-3xl font-extrabold mb-2 text-white tracking-tight">⌨️ <span class="text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-yellow-600">Ping Game</span></h1>
    <p class="text-slate-400 mb-6 text-sm">Turn all pieces black. Clicking a cell toggles its neighbors.</p>

    <div id="grid" class="grid grid-cols-6 gap-2 justify-center w-full mb-2"></div>

    <div class="mt-8 flex flex-col sm:flex-row justify-center gap-3 w-full">
       <button onclick="location.reload()" class="flex-1 px-4 py-2 rounded-lg bg-yellow-600 hover:bg-yellow-700 text-white font-medium transition-colors shadow-lg shadow-yellow-500/20">
         🔄 Restart
       </button>
       <a href="../../index.html" class="flex-1 px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium transition-colors border border-slate-700 hover:border-slate-600">
         ← Back to games
       </a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
